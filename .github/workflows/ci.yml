name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: node --check src/index.js

      - name: 单元测试
        run: node --test "tests/**/*.test.mjs"

      - name: manifest 自检
        run: node scripts/verify-manifest.mjs

  no-deps:
    name: 零运行时依赖检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json 不得声明运行时依赖
        run: |
          node -e "
          const p = require('./package.json');
          const deps = Object.keys(p.dependencies || {});
          if (deps.length) { console.error('第一版不应有运行时依赖:', deps); process.exit(1); }
          if (!p.dsh || !p.dsh.bundle || !p.dsh.bundle.patch) { console.error('缺少 dsh.bundle.patch'); process.exit(1); }
          if (!p.engines || !p.engines.dsh) { console.error('缺少 engines.dsh'); process.exit(1); }
          console.log('manifest ok');
          "
