# 示例：用集合石替代 CLIWorker 的团队配置（2026-11-10 实测版）
#
# 用法：把下面的行并入 profile 的 cordis.patch.yml（或整段追加），重启 DSH。
#   Windows: %USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml
#
# 前置（两条外部通道各需一次安装）：
#   dsh plugin --profile desktop add @deepseek-ai/dsh-subagent-codex@0.2.2-rc.1   # bundle，装完即生效
#   dsh plugin --profile desktop add @deepseek-ai/dsh-subagent-acp@0.2.2-rc.1     # 非 bundle，还要下面那条 insert
#
# 实测要点（都是踩过的坑）：
# 1) provider 自带的 Codex 是 0.153.4，ChatGPT 账号下**只有 gpt-5.6-sol** 可用，必须在 provider 行写死。
# 2) CodeBuddy 的 ACP 入口要「保持 stdin 打开」才能起来；用 node + bin 脚本启动，不能用 .cmd。
# 3) 用户补丁里**新增**行必须包在 insert: 下；裸的 "- id: xxx" 只用于覆盖已存在的行。
# 4) 只读档位由通道实例保证：要真正的只读角色，得单独配一个 permissionMode: 只读的 provider 行。

# ── Codex 通道（provider 行覆盖：模型必须写这里）─────────────────────────────
- id: subagent-codex
  name: '@deepseek-ai/dsh-subagent-codex'
  config:
    providerName: codex
    model: gpt-5.6-sol
    permissionMode: never

# ── ACP 通道（接本机 CodeBuddy）───────────────────────────────────────────────
- insert:
    - id: subagent-acp
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: acp
        command: '<宿主 node.exe 的绝对路径>'
        args:
          - '<codebuddy bin 脚本的绝对路径>'
          - '--acp'
        permission: allow

# ── 集合石的角色与通道 ───────────────────────────────────────────────────────
- insert:
    - id: meetingstone
      name: dsh-meetingstone
      config:
        channels:
          - channelId: ch-codex
            description: Codex · gpt-5.6-sol（provider 行已固定该模型）
            kind: codex
            provider: codex
            model: gpt-5.6-sol
            permissionPreset: project-write

          - channelId: ch-acp
            description: CodeBuddy · ACP（模型由 CodeBuddy 自己决定）
            kind: acp-cli
            provider: acp
            permissionPreset: project-write

          - channelId: ch-inprocess
            description: DSH 原生子 Agent
            kind: in-process
            provider: spawn
            permissionPreset: read-only

        roles:
          - roleId: role-tangtang
            name: 唐僧
            aliases: [TT, 领导]
            description: 团队领导
            prompt: >-
              你是团队领导，负责架构、战略、关键决策和最终质量把关。不要亲自做一线实现；
              给出方向、评审方案、验收结果，并对最终交付负责。
            channel: { kind: codex, channelId: ch-codex, model: gpt-5.6-sol }
            permissionPreset: project-write
            timeoutMs: 3600000

          - roleId: role-wukong
            name: 悟空
            aliases: [WK, 专家]
            description: 核心资深专家
            prompt: >-
              你是核心资深专家，负责解决疑难问题、审核验收和长时间任务。
              优先给出可验证的结论和证据，不做表面修改；复核他人结论时必须自己动手验证。
            channel: { kind: codex, channelId: ch-codex, model: gpt-5.6-sol }
            permissionPreset: project-write
            timeoutMs: 3600000

          - roleId: role-sashi
            name: 沙僧
            aliases: [SS, 主力执行]
            description: 技术骨干
            prompt: >-
              你是技术骨干，负责主力开发与批量执行。按任务要求执行，只改被授权的文件；
              每个结论都要附证据，拿不到就写未验证，不要猜。
            channel: { kind: acp-cli, channelId: ch-acp }
            permissionPreset: project-write
            timeoutMs: 1800000

          - roleId: role-xiaobai
            name: 小白
            aliases: [XB, 打杂]
            description: 牛马
            prompt: >-
              你是小白，负责主力开发、文档整理、测试辅助和各类杂活。
              按任务要求执行，只改被授权的文件；不确定的先说明，不要编造。
            channel: { kind: acp-cli, channelId: ch-acp }
            permissionPreset: project-write
            timeoutMs: 1800000

          - roleId: role-bajie
            name: 八戒
            aliases: [BJ, 调度]
            description: 技术主管（调度/监工/整合，一般由主 Agent 自己承担）
            channel: { kind: in-process, channelId: ch-inprocess }
            permissionPreset: read-only
            timeoutMs: 1800000

        defaultRoleId: role-sashi
        dispatchNotes: 常规实现优先沙僧/小白；关键修改交悟空复核；重大取舍才找唐僧。
        limits: { maxParallelReadonly: 3, serializeWrites: true }
